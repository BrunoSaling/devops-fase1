name: Pipeline de Integração Contínua

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Validação dos arquivos do repositório
  # ──────────────────────────────────────────
  validar-repositorio:
    name: Validar Estrutura do Repositório
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          echo "=== Verificando estrutura do repositório ==="
          echo "Arquivos na raiz:"
          ls -la

          echo ""
          echo "Arquivos Terraform:"
          find terraform/ -type f | sort

          echo ""
          echo "✅ Estrutura verificada com sucesso!"

      - name: Verificar sintaxe dos arquivos YAML
        run: |
          echo "=== Verificando arquivos YAML ==="
          find . -name "*.yml" -o -name "*.yaml" | grep -v ".git" | while read f; do
            echo "Verificando: $f"
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" && echo "  ✅ OK" || echo "  ❌ Erro de sintaxe"
          done

  # ──────────────────────────────────────────
  # JOB 2: Validação do Terraform
  # ──────────────────────────────────────────
  terraform-validate:
    name: Validar Infraestrutura (Terraform)
    runs-on: ubuntu-latest
    needs: validar-repositorio

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          echo "=== Verificando formatação dos arquivos Terraform ==="
          terraform fmt -check -recursive ./terraform && echo "✅ Formatação OK" || echo "⚠️  Arquivos fora do padrão (não bloqueia o pipeline)"
        continue-on-error: true

      - name: Terraform Init
        run: |
          echo "=== Inicializando Terraform (sem backend remoto) ==="
          cd terraform
          terraform init -backend=false
          echo "✅ Init concluído"

      - name: Terraform Validate
        run: |
          echo "=== Validando sintaxe dos arquivos Terraform ==="
          cd terraform
          terraform validate
          echo "✅ Validação concluída"

  # ──────────────────────────────────────────
  # JOB 3: Relatório de Segurança
  # ──────────────────────────────────────────
  seguranca:
    name: Análise de Segurança (tfsec)
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./terraform
          soft_fail: true

      - name: Resumo de segurança
        run: |
          echo "✅ Análise de segurança concluída (soft_fail ativo — não bloqueia o pipeline)"

  # ──────────────────────────────────────────
  # JOB 4: Gerar relatório final
  # ──────────────────────────────────────────
  relatorio-final:
    name: Relatório Final do Pipeline
    runs-on: ubuntu-latest
    needs: [terraform-validate, seguranca]
    if: always()

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar relatório
        run: |
          echo "============================================"
          echo "   RELATÓRIO FINAL — FASE 1 DEVOPS"
          echo "============================================"
          echo ""
          echo "📁 Repositório: ${{ github.repository }}"
          echo "🌿 Branch:      ${{ github.ref_name }}"
          echo "👤 Autor:       ${{ github.actor }}"
          echo "📅 Data:        $(date '+%d/%m/%Y %H:%M')"
          echo "🔖 Commit:      ${{ github.sha }}"
          echo ""
          echo "📋 Resultado dos jobs:"
          echo "  • Validar Repositório:     ${{ needs.validar-repositorio.result || 'skipped' }}"
          echo "  • Terraform Validate:      ${{ needs.terraform-validate.result }}"
          echo "  • Análise de Segurança:    ${{ needs.seguranca.result }}"
          echo ""
          echo "============================================"
          echo "✅ Pipeline executado com sucesso!"
          echo "============================================"
