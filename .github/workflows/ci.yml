name: Pipeline de Integração Contínua

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Lint e Análise Estática de Código
  # ──────────────────────────────────────────
  lint:
    name: Lint e Análise Estática
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar formatação (Prettier)
        run: npm run format:check

  # ──────────────────────────────────────────
  # JOB 2: Testes Automatizados
  # ──────────────────────────────────────────
  test:
    name: Testes Unitários e de Integração
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --coverage

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────
  # JOB 3: Validação do Terraform
  # ──────────────────────────────────────────
  terraform-validate:
    name: Validar Infraestrutura (Terraform)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Inicializar Terraform
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Validar sintaxe do Terraform
        run: terraform validate
        working-directory: ./terraform

      - name: Verificar formatação do Terraform
        run: terraform fmt -check -recursive
        working-directory: ./terraform

      - name: Analisar segurança com tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./terraform
          soft_fail: true

  # ──────────────────────────────────────────
  # JOB 4: Build da Aplicação
  # ──────────────────────────────────────────
  build:
    name: Build da Aplicação
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 30

  # ──────────────────────────────────────────
  # JOB 5: Notificação de Resultado
  # ──────────────────────────────────────────
  notify:
    name: Notificar Resultado
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Resultado do Pipeline
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Pipeline concluído com sucesso!"
          else
            echo "❌ Pipeline falhou. Verifique os logs acima."
            exit 1
          fi
